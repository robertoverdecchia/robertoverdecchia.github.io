<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Password Required</title>

    <style>
        :root {
            --bg: hsl(0 0% 100%);
            --card: hsl(0 0% 100%);
            --text: hsl(222 47% 11%);
            --muted: hsl(215 16% 47%);
            --border: hsl(214 32% 91%);
            --primary: hsl(222 47% 20%);
            --primary-hover: hsl(222 47% 15%);

            --error-bg: hsl(0 86% 97%);
            --error-text: hsl(0 74% 42%);
            --error-border: hsl(0 93% 94%);

            --radius-sm: 0.375rem;
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;

            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --ring: 0 0 0 3px hsl(222 84% 95%);

            --space-2: 0.5rem;
            --space-3: 0.75rem;
            --space-4: 1rem;
            --space-6: 1.5rem;
            --space-8: 2rem;

            --font-base: -apple-system, BlinkMacSystemFont, "Segoe UI",
                "Roboto", "Oxygen", "Ubuntu", "Cantarell", "Fira Sans",
                "Droid Sans", "Helvetica Neue", sans-serif;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            padding: var(--space-4);
            font-family: var(--font-base);
            font-size: 0.875rem;
            color: var(--text);
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            width: 100%;
            max-width: 25rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        .alert {
            display: none;
            padding: var(--space-3) var(--space-4);
            background: var(--error-bg);
            color: var(--error-text);
            border-bottom: 1px solid var(--error-border);
        }

        .content {
            padding: var(--space-8);
            text-align: center;
        }

        .content svg {
            display: block;
            width: 2rem;
            margin: 0 auto var(--space-4);
            color: var(--primary);
        }

        .title {
            margin: 0 0 var(--space-2);
            font-size: 1.25rem;
            font-weight: 600;
        }

        .description {
            margin: 0 0 var(--space-6);
            color: var(--muted);
        }

        .input {
            width: 100%;
            padding: 0.625rem 0.75rem;
            font: inherit;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--card);
            margin-bottom: var(--space-4);
        }

        .input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: var(--ring);
        }

        .button {
            width: 100%;
            padding: 0.625rem 1rem;
            font: inherit;
            font-weight: 500;
            border: none;
            border-radius: var(--radius-md);
            background: var(--primary);
            color: white;
            cursor: pointer;
        }

        .button:hover {
            background: var(--primary-hover);
        }
    </style>
</head>

<body>

<div class="card">
    <div class="alert" data-id="alert">
        Incorrect password. Please try again.
    </div>

    <div class="content">

        <svg viewBox="0 0 15 15" fill="none">
            <path d="M5 4.63601C5 3.76031 5.24219 3.1054 5.64323 2.67357C6.03934
                2.24705 6.64582 1.9783 7.5014 1.9783C8.35745 1.9783 8.96306
                2.24652 9.35823 2.67208C9.75838 3.10299 10 3.75708 10
                4.63325V5.99999H5V4.63601ZM4 5.99999V4.63601C4 3.58148
                4.29339 2.65754 4.91049 1.99307C5.53252 1.32329 6.42675
                0.978302 7.5014 0.978302C8.57583 0.978302 9.46952 1.32233
                10.091 1.99162C10.7076 2.65557 11 3.57896 11
                4.63325V5.99999H12C12.5523 5.99999 13 6.44771 13
                6.99999V13C13 13.5523 12.5523 14 12 14H3C2.44772 14 2
                13.5523 2 13V6.99999C2 6.44771 2.44772 5.99999 3
                5.99999H4ZM3 6.99999H12V13H3V6.99999Z" fill="currentColor">
            </path>
        </svg>

        <h1 class="title">Password Required</h1>
        <p class="description">Enter your password to continue</p>

        <input class="input" data-id="password" type="password" placeholder="Enter password" autocomplete="current-password" />

        <button class="button" data-id="button" type="button">
            Continue
        </button>

    </div>
</div>

<script>
class PasswordGate {
    constructor() {
        this.elements = {
            alert: document.querySelector('[data-id="alert"]'),
            password: document.querySelector('[data-id="password"]'),
            button: document.querySelector('[data-id="button"]')
        };

        this.elements.button.addEventListener(
            'click',
            () => this.handleSubmit()
        );

        this.elements.password.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                this.handleSubmit();
            }
        });
    }

    async handleSubmit() {
        const password = this.elements.password.value;

        if (!password) {
            return;
        }

        const hash = await this.hashPassword(password);

        /*
         * Because this gate is /private/,
         * this resolves to:
         *
         * /private/HASH/
         */
        const url = `./${hash}/`;

        try {
            const response = await fetch(url, {
                method: 'GET',
                cache: 'no-store'
            });

            if (response.ok) {
                window.location.href = url;
                return;
            }
        } catch (error) {
            // Treat network failure the same as an incorrect password.
        }

        this.showError();
    }

    async hashPassword(password) {
        const data = new TextEncoder().encode(password);

        const hashBuffer = await crypto.subtle.digest(
            'SHA-1',
            data
        );

        return Array.from(new Uint8Array(hashBuffer))
            .map(byte => byte.toString(16).padStart(2, '0'))
            .join('');
    }

    showError() {
        this.elements.alert.style.display = 'block';
        this.elements.password.value = '';
        this.elements.password.focus();
    }
}

new PasswordGate();
</script>

</body>
</html>
